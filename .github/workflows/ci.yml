name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Read-only by default: this job only checks out and builds. Without this,
    # the token carries whatever the repository default grants.
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # v5 and up run on node24. v4 ran on node20, which GitHub has deprecated.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Above the engines floor on purpose, and the same version the
          # Dockerfile pins. This is the release CI verifies against; see the
          # note in README "Requirements" about newer lines.
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
